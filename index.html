<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>顧客機維護組專用-班表小助手</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
body{background:#fdf8e7;font-family:'Segoe UI','Microsoft JhengHei',sans-serif;padding-top:20px;padding-bottom:50px}
.card{border-radius:15px;border:none;box-shadow:0 5px 15px rgba(0,0,0,.08);margin-bottom:25px;overflow:hidden;background:#fdf8e7}
.upload-area{text-align:center;padding:40px 20px;border:2px dashed #4361ee;border-radius:12px;background:#fdf8e7;cursor:pointer}
.file-input-hidden{display:none}
#selectFileBtn{background:#4361ee;border-color:#4361ee;padding:12px 30px;border-radius:10px}
.file-btn-text{color:#000!important;font-weight:700!important}
.file-info,.error-message{padding:10px 15px;border-radius:8px;margin-top:15px}
.file-info{background:#e8f5e8;border-left:4px solid #28a745}
.error-message{background:#ffe6e6;color:#dc3545;border-left:4px solid #dc3545}
.loading-spinner{display:none;text-align:center;padding:40px;background:#fdf8e7;border-radius:15px;margin:20px 0}
.result-section{display:none}
.person-selector{background:#fdf8e7;padding:25px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,.08);margin-bottom:25px}
.person-selector select,.week-start-selector select{background:#fff!important;border-radius:10px;border:2px solid #e0e0e0;padding:12px 20px;font-size:1.1rem}
.person-selector .btn-outline-secondary,.person-selector .btn-outline-primary{background:#fff}
.person-info-card{background:#fff;padding:20px;border-radius:12px;border-left:5px solid #4361ee;margin-bottom:25px}
.shift-summary-section{background:#fff;border-radius:15px;padding:20px;box-shadow:0 5px 15px rgba(0,0,0,.08);margin-bottom:25px}
.weekly-calendar{background:#fdf8e7;border-radius:15px;overflow-x:auto;box-shadow:0 5px 15px rgba(0,0,0,.08);margin-bottom:25px}
.weekly-calendar-table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:700px}
.weekly-calendar-table th,.weekly-calendar-table td{width:14.2857%!important;box-sizing:border-box}
.weekly-calendar-header{background:#4361ee;color:#fff}
.weekday-header{padding:15px 5px;text-align:center;border-right:1px solid rgba(255,255,255,.2)}
.day-cell{background:#fff9ef;padding:6px 4px;height:120px;vertical-align:top;text-align:center;border:1px solid #eaeaea;cursor:pointer;overflow-y:auto}
.day-cell:hover{box-shadow:0 5px 15px rgba(0,0,0,.1);background:#fff0d6}
.day-cell.today{border:2px solid #ff6b6b;background:#ffece5}
.day-date{font-size:1.2rem;font-weight:700;color:#333;margin-bottom:4px}
.day-shift{font-size:.9rem;font-weight:600;margin-bottom:2px;display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.day-shift-time{font-size:.7rem;color:#666;margin-bottom:2px}
.day-note{font-size:.6rem;color:#FF69B4;background:#fff;border-radius:6px;padding:1px 3px;margin-top:2px;overflow:hidden;max-height:2.2em;line-height:1.2}
.summary-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:15px}
.summary-content{max-height:600px;overflow-y:auto}
.summary-content.collapsed{max-height:0;overflow:hidden}
.summary-item{display:flex;justify-content:space-between;padding:10px 15px;margin-bottom:6px;background:#f8f9fa;border-radius:8px;border-left:4px solid #4361ee}
.summary-section-title{font-weight:700;font-size:1rem;margin:10px 0 8px;padding-bottom:4px;border-bottom:2px solid #4361ee;color:#2c3e50}
.shift-divider-green{border-top:3px solid #28a745;margin:12px 0;width:100%}
.color-settings-section{background:#fdf8e7;border-radius:15px;padding:20px;box-shadow:0 5px 15px rgba(0,0,0,.08);margin-bottom:25px;display:none}
.color-setting-item{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:12px 15px;margin-bottom:8px;background:#fff9ef;border-radius:8px}
.shift-label{min-width:55px;font-weight:600}
.time-label{flex:2;font-size:.85rem;color:#555}
.color-preview{width:40px;height:40px;border-radius:6px;border:2px solid #ddd}
.color-input-group{display:flex;gap:8px}
.color-input{width:65px;text-align:center;background:#fff}
.action-buttons{display:flex;gap:15px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.action-btn{padding:10px 24px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.copy-notification,.download-notification{position:fixed;bottom:30px;right:30px;background:#28a745;color:#fff;padding:12px 20px;border-radius:10px;z-index:1000;opacity:0;transform:translateY(20px);transition:.3s}
.copy-notification.show,.download-notification.show{opacity:1;transform:translateY(0)}
.float-copy-btn{position:fixed;top:20px;right:20px;z-index:9999;background:#4361ee;color:#fff;border:none;border-radius:40px;padding:8px 16px;font-size:14px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.float-copy-btn:hover{background:#2b4bdf}
@media(max-width:768px){.day-cell{height:90px;padding:4px 2px}.day-date{font-size:1rem}.day-shift{font-size:.8rem}.day-shift-time{font-size:.6rem}.day-note{font-size:.5rem}.float-copy-btn{top:10px;right:10px;padding:6px 12px;font-size:12px}}
.shift-option-btn{margin:4px;padding:6px 12px;background:#fff}
.wallpaper-note{font-size:.75rem;color:#6c757d;margin-top:8px}
.modal-note-input{width:100%;margin-top:15px;padding:8px;border-radius:8px;border:1px solid #ccc;background:#fff9ef}
.modal-content{background:#fdf8e7}
.modal-header,.modal-footer{border-color:#e0d5b5}
.alert-secondary{background:#fff!important;border:1px solid #dee2e6;color:#2c3e50}
.person-main-note{font-size:.85rem;color:#555;margin-top:8px;padding:8px 12px;background:#fff9ef;border-radius:8px;border-left:3px solid #ffc107}
</style>
</head>
<body>
<div class="container">
<div class="text-center mb-4"><h1 class="fw-bold text-primary"><i class="bi bi-calendar-check"></i> 顧客機維護組專用-班表小助手</h1><p class="text-muted">自動讀取 CUST 工作表</p></div>
<div class="card"><div class="card-body"><h5 class="card-title"><i class="bi bi-upload"></i> 上傳班表檔案</h5>
<div class="upload-area" id="uploadArea">
<div><i class="bi bi-file-earmark-excel" style="font-size:4rem;color:#4361ee"></i></div>
<h4 class="upload-instruction">點擊選擇檔案 上傳班表</h4>
<p class="text-muted">支援 .xlsx / .xls｜自動讀取「CUST-11」工作表</p>
<input type="file" id="fileInput" class="file-input-hidden" accept=".xlsx,.xls,.xlsm">
<button class="btn btn-primary btn-lg" id="selectFileBtn"><i class="bi bi-folder2-open"></i> <span class="file-btn-text">選擇檔案</span></button>
<div id="fileInfo" class="file-info mt-3" style="display:none"><i class="bi bi-check-circle text-success"></i><span id="fileName"></span></div>
<div id="errorMessage" class="error-message" style="display:none"></div>
</div>
</div></div>
<div class="loading-spinner" id="loadingSpinner"><div class="spinner-border text-primary"></div><h4 class="mt-3">解析班表中...</h4></div>
<div class="result-section" id="resultSection">
<div class="color-settings-section" id="colorSettingsSection">
<div class="d-flex justify-content-between"><h5><i class="bi bi-palette"></i> 班型顏色設定</h5><button class="btn btn-sm btn-outline-secondary" id="toggleColorSettingsBtn"><i class="bi bi-chevron-up"></i> 隱藏</button></div>
<div id="colorSettingsContainer"></div>
<div class="mt-2"><button class="btn btn-primary btn-sm" id="saveColorsBtn">儲存</button><button class="btn btn-secondary btn-sm" id="resetColorsBtn">重設預設</button></div>
</div>
<div class="week-start-selector mt-2" id="weekStartSelector" style="display:none"><label>每週第一天</label><select class="form-select w-50" id="weekStartDaySelect"><option value="0">週日</option><option value="1">週一</option></select></div>
<div class="person-selector">
<h5><i class="bi bi-person-search"></i> 選擇人員</h5>
<div class="row g-3 mb-3"><div class="col-md-12"><label class="form-label fw-bold">選擇人員</label><select class="form-select form-select-lg" id="personSelect"><option value="">請先上傳班表</option></select></div></div>
<div class="d-flex justify-content-between mt-3 flex-wrap gap-2">
<button class="btn btn-outline-secondary" id="reuploadBtn"><i class="bi bi-arrow-clockwise"></i> 重新上載</button>
<button class="btn btn-outline-primary" id="toggleColorSettingsBtn2"><i class="bi bi-palette"></i> 顏色設定</button>
</div>
<div class="wallpaper-note mt-2"><i class="bi bi-info-circle"></i> 點擊日期可修改班型與備註。</div>
</div>
<div class="card mt-3"><div class="card-body">
<div id="selectedPersonInfo" class="alert alert-info" style="display:none"></div>
<div id="personInfoCard" class="person-info-card" style="display:none">
<div class="row"><div class="col-md-8"><h4 id="personNameDisplay"></h4><span id="personCategoryDisplay" class="badge bg-secondary"></span><span id="monthDisplay" class="badge bg-primary ms-2"></span><div id="personMainNote" class="person-main-note" style="display:none"></div></div>
<div class="col-md-4 text-md-end"><button class="btn btn-primary" id="copyPersonScheduleBtn"><i class="bi bi-clipboard"></i> 複製班表</button></div></div>
</div>
<div id="personWeeklyCalendar" class="weekly-calendar" style="display:none"><table class="weekly-calendar-table"><thead id="weekHeader" class="weekly-calendar-header"></thead><tbody id="weeklyCalendarBody"></tbody></table></div>
<div id="personShiftSummary" class="shift-summary-section" style="display:none"><div class="summary-header" id="summaryToggleBtn"><h5 class="summary-title"><i class="bi bi-bar-chart"></i> 班表統計</h5><button class="btn summary-toggle"><i class="bi bi-chevron-down"></i></button></div><div class="summary-content collapsed" id="shiftSummaryContent"></div></div>
<div class="action-buttons" id="actionButtons" style="display:none">
<button class="btn btn-success action-btn" id="downloadImageBtn"><i class="bi bi-image"></i> 下載一般圖片</button>
<button class="btn btn-primary action-btn" id="copyPersonScheduleBtn2"><i class="bi bi-clipboard"></i> 複製班表</button>
<button class="btn btn-warning action-btn" id="wallpaperBtn"><i class="bi bi-phone"></i> 📱 下載完美手機桌布</button>
</div>
</div></div>
</div>
</div>
<div class="copy-notification" id="copyNotification"><i class="bi bi-check-circle"></i> 已複製</div>
<div class="download-notification" id="downloadNotification"><i class="bi bi-check-circle"></i> 生成中...</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const shiftDescriptions={'K0':'05:00~13:00','M':'05:30~13:30','M0':'04:00~12:00','M1':'06:00~14:00','M2':'06:30~14:30','M3':'07:00~15:00','M4':'07:30~15:30','D':'08:00~16:00','D1':'08:00~16:30','D2':'10:00~18:00','D4':'08:00~16:30','D5':'09:00~17:00','D6':'12:00~20:00','正班':'08:30~17:30','K1':'13:30~21:30','K2':'14:00~22:00','N1':'14:30~22:30','T1':'14:30~22:30','K3':'18:00~02:00','K4':'19:00~03:00','N3':'15:00~23:00','N':'16:00~24:00','N5':'00:00~08:00','N6':'15:30~23:30','K5':'21:00~05:00','K6':'22:00~06:00','K7':'23:00~07:00','N2':'22:30~06:30','T2':'22:30~06:30','T':'08:00~16:30','T3':'08:00~16:00','Z':'例假日','R':'休假日','GBL':'國定假','L':'補休','FL':'福利補休','AL':'特休預排日','A':'特休假','SI':'病假','CF':'陪產假','Ma':'婚假','B':'喪假','E':'事假','Y':'年祭假','O':'公差','P':'公出','H':'公傷','公':'公假','福':'福利假','體檢':'體檢假','值星':'值星','隨機':'隨機班','P4/L4':'公出4H/補休4H','A5/L3':'A5/L3','L1/P4':'L1/P4','/2L':'/2L'};
const holidayShifts=['Z','R','GBL','L','A','公','福','體檢','AL','FL','SI','CF','Ma','B','E','Y','P4/L4','A5/L3','L1/P4','/2L'];
const companyHolidays=['R','Z','GBL'];
const defaultShiftColors={'K0':{r:255,g:255,b:102},'M':{r:255,g:255,b:102},'M0':{r:255,g:255,b:102},'M1':{r:255,g:255,b:102},'M2':{r:255,g:255,b:102},'M3':{r:255,g:255,b:102},'M4':{r:255,g:255,b:102},'D':{r:255,g:107,b:107},'D1':{r:255,g:107,b:107},'D2':{r:255,g:107,b:107},'D4':{r:255,g:107,b:107},'D5':{r:255,g:107,b:107},'D6':{r:255,g:107,b:107},'正班':{r:255,g:107,b:107},'K1':{r:153,g:153,b:255},'K2':{r:153,g:153,b:255},'K3':{r:153,g:153,b:255},'K4':{r:153,g:153,b:255},'K5':{r:153,g:153,b:255},'K6':{r:153,g:153,b:255},'K7':{r:153,g:153,b:255},'N':{r:153,g:153,b:255},'N1':{r:153,g:153,b:255},'N2':{r:153,g:153,b:255},'N3':{r:153,g:153,b:255},'N5':{r:153,g:153,b:255},'N6':{r:153,g:153,b:255},'T':{r:200,g:200,b:255},'T1':{r:200,g:200,b:255},'T2':{r:200,g:200,b:255},'T3':{r:200,g:200,b:255},'Z':{r:204,g:255,b:229},'R':{r:204,g:255,b:229},'GBL':{r:204,g:255,b:229},'L':{r:204,g:255,b:229},'A':{r:204,g:255,b:229},'AL':{r:204,g:255,b:229},'FL':{r:204,g:255,b:229},'SI':{r:255,g:220,b:220},'CF':{r:255,g:220,b:220},'Ma':{r:255,g:220,b:220},'B':{r:255,g:220,b:220},'E':{r:255,g:220,b:220},'Y':{r:255,g:220,b:220},'公':{r:255,g:192,b:203},'福':{r:204,g:255,b:229},'體檢':{r:204,g:255,b:229},'O':{r:255,g:228,b:181},'P':{r:255,g:228,b:181},'H':{r:255,g:228,b:181},'值星':{r:255,g:215,b:0},'隨機':{r:220,g:220,b:220},'P4/L4':{r:255,g:210,b:210},'A5/L3':{r:255,g:210,b:210},'L1/P4':{r:255,g:210,b:210},'/2L':{r:255,g:210,b:210}};
const SPECIAL_DEFAULT_COLOR={r:255,g:192,b:203};
let scheduleData=[];
let shiftColors={...defaultShiftColors};
let scheduleYear=2026,scheduleMonth=11,weekStartDay=0,isSummaryCollapsed=true;
let globalSpecialShifts=new Set();

function getShiftStartMinutes(c){if(holidayShifts.includes(c))return 99999;const d=shiftDescriptions[c];if(d&&d.includes('~')){let[h,m]=d.split('~')[0].trim().split(':').map(Number);return h*60+m}return 1439}
function getSortedShiftList(set){let w=[],h=[];for(let s of set){holidayShifts.includes(s)?h.push(s):w.push(s)}w.sort((a,b)=>getShiftStartMinutes(a)-getShiftStartMinutes(b));h.sort();return[...w,...h]}
function refreshSpecialShifts(){let f=new Set();for(let p of scheduleData)for(let d in p.shifts){let c=p.shifts[d].shift;if(c&&!shiftDescriptions[c])f.add(c)}globalSpecialShifts=f;for(let s of f)if(!shiftColors[s])shiftColors[s]={...SPECIAL_DEFAULT_COLOR};for(let k in shiftColors)if(!shiftDescriptions[k]&&!f.has(k))delete shiftColors[k]}

function createColorSettings(specials){
const c=document.getElementById('colorSettingsContainer');if(!c)return;c.innerHTML='';
let work=Object.keys(shiftDescriptions).filter(s=>!holidayShifts.includes(s)).sort((a,b)=>getShiftStartMinutes(a)-getShiftStartMinutes(b));
let hol=Object.keys(shiftDescriptions).filter(s=>holidayShifts.includes(s)).sort();
function add(s,sp){
let col=shiftColors[s]||{r:128,g:128,b:128},desc=shiftDescriptions[s]||(sp?'特殊班型':'');
let it=document.createElement('div');it.className='color-setting-item';
it.innerHTML=`<div class="shift-label">${s}</div><div class="time-label">${desc}</div><div class="color-preview" id="preview_${s}" style="background:rgb(${col.r},${col.g},${col.b})"></div><div class="color-input-group"><div><span class="badge bg-secondary">R</span><input type="number" min="0" max="255" class="form-control form-control-sm color-input" data-shift="${s}" data-type="r" value="${col.r}"></div><div><span class="badge bg-secondary">G</span><input type="number" min="0" max="255" class="form-control form-control-sm color-input" data-shift="${s}" data-type="g" value="${col.g}"></div><div><span class="badge bg-secondary">B</span><input type="number" min="0" max="255" class="form-control form-control-sm color-input" data-shift="${s}" data-type="b" value="${col.b}"></div></div>`;
c.appendChild(it);
it.querySelectorAll('.color-input').forEach(inp=>inp.addEventListener('input',()=>{
let k=inp.dataset.shift,t=inp.dataset.type,v=parseInt(inp.value);
if(isNaN(v))return;
if(v<0)v=0;if(v>255)v=255;
if(!shiftColors[k])shiftColors[k]={r:128,g:128,b:128};
shiftColors[k][t]=v;
document.getElementById('preview_'+k).style.backgroundColor=`rgb(${shiftColors[k].r},${shiftColors[k].g},${shiftColors[k].b})`;
refreshCalendarAndSummaryColors();
}));
}
work.forEach(s=>add(s));if(work.length&&hol.length){let hr=document.createElement('hr');hr.style.borderTop='3px solid #f00';hr.style.margin='12px 0';c.appendChild(hr)}
hol.forEach(s=>add(s));
if(specials&&specials.length){let hr=document.createElement('hr');hr.style.borderTop='3px solid #f00';hr.style.margin='16px 0';c.appendChild(hr);let t=document.createElement('div');t.className='fw-bold mb-2 text-secondary';t.innerText='✨ 特殊班型';c.appendChild(t);[...specials].sort().forEach(s=>add(s,true))}
}

// ★ 顏色輸入時只重繪日曆與統計，不重建顏色面板
function refreshCalendarAndSummaryColors(){
let n=document.getElementById('personSelect').value;
if(!n)return;
let p=scheduleData.find(x=>x.name===n);
if(!p)return;
createCalendar(p);
createSummary(p);
}

function createSummary(p){
const c=document.getElementById('shiftSummaryContent');if(!c)return;c.innerHTML='';
let dim=new Date(scheduleYear,scheduleMonth,0).getDate(),counts={},work=new Set(),comp=new Set(),pers=new Set();
for(let d=1;d<=dim;d++){let sd=p.shifts[d];if(sd){let k=sd.shift;counts[k]=(counts[k]||0)+1;if(holidayShifts.includes(k)){companyHolidays.includes(k)?comp.add(k):pers.add(k)}else work.add(k)}}
let wl=[...work].sort((a,b)=>getShiftStartMinutes(a)-getShiftStartMinutes(b));
let cl=companyHolidays.filter(h=>comp.has(h));
let pl=[...pers].sort();
let wt=0,ct=0,pt=0;wl.forEach(s=>wt+=counts[s]);cl.forEach(s=>ct+=counts[s]);pl.forEach(s=>pt+=counts[s]);
function add(s,n){if(!n)return;let col=shiftColors[s]||{r:128,g:128,b:128},desc=shiftDescriptions[s]||(globalSpecialShifts.has(s)?'特殊班型':'');let it=document.createElement('div');it.className='summary-item';it.style.borderLeftColor=`rgb(${col.r},${col.g},${col.b})`;it.innerHTML=`<span>${s} ${desc}</span><span>${n} 天</span>`;c.appendChild(it)}
if(wl.length){let t=document.createElement('div');t.className='summary-section-title';t.innerHTML=`📋 上班：共 ${wt} 天`;c.appendChild(t);wl.forEach(s=>add(s,counts[s]))}
if(cl.length){let t=document.createElement('div');t.className='summary-section-title';t.innerHTML=`🏢 放假(公司)：共 ${ct} 天`;c.appendChild(t);cl.forEach(s=>add(s,counts[s]))}
if(cl.length&&pl.length){let d=document.createElement('div');d.className='shift-divider-green';c.appendChild(d)}
if(pl.length){let t=document.createElement('div');t.className='summary-section-title';t.innerHTML=`👤 放假(自己)：共 ${pt} 天`;c.appendChild(t);pl.forEach(s=>add(s,counts[s]))}
let total=wt+ct+pt;
if(total>0){let it=document.createElement('div');it.className='summary-item mt-2';it.style.borderTop='2px solid #4361ee';it.innerHTML=`<span class="fw-bold">📅 總計</span><span class="fw-bold">${total} 天</span>`;c.appendChild(it)}
}

function createCalendar(p){
const tb=document.getElementById('weeklyCalendarBody');if(!tb)return;tb.innerHTML='';updateWeekHeader();
let dim=new Date(scheduleYear,scheduleMonth,0).getDate(),fd=new Date(scheduleYear,scheduleMonth-1,1).getDay();
let eb=(weekStartDay===0)?fd:(fd===0?6:fd-1);
for(let w=0;w<6;w++){let tr=document.createElement('tr');for(let col=0;col<7;col++){let idx=w*7+col,dn=idx-eb+1,td=document.createElement('td');td.className='day-cell';let today=new Date();if(scheduleYear===today.getFullYear()&&scheduleMonth===today.getMonth()+1&&dn===today.getDate())td.classList.add('today');
if(dn>=1&&dn<=dim){let dd=document.createElement('div');dd.className='day-date';dd.textContent=dn;td.appendChild(dd);let sd=p.shifts[dn];

function isValidName(n){if(!n||typeof n!=='string')return false;let t=n.trim();if(t.length<2)return false;const bad=['姓名','Name','人員','星期','週','週次','序號','編號','No.','NO.','員工','日期','DAY','Day','天數','日期/姓名','日期/人員','組長','領班','早班','中班','晚班','地裝','行政','QC','補給庫房','直接人力','人力需求','可休假','班別','班型','代領班','早班人力','中班人力','晚班人力','人力需求員額','可休假人力','主管','總數','休假','上課','病假','出席人數'];for(let k of bad)if(t.includes(k))return false;if(/^星期[一二三四五六日]$/.test(t))return false;if(/^週[一二三四五六日]$/.test(t))return false;if(/^\d+$/.test(t))return false;if(/^[A-Za-z]{1,2}$/.test(t))return false;return true}

function parseWorkbook(wb,fileName){
let target=wb.SheetNames.find(n=>/^CUST-\d+$/i.test(n))||wb.SheetNames[0];
if(!target){showError('找不到工作表');return}
let sheet=wb.Sheets[target];let json=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});
if(json.length<5){showError('工作表資料太少');return}
let year=2026,month=11;
let a1=json[0]?getCell(json[0],0):'',b1=json[0]?getCell(json[0],1):'';
let ym=a1.match(/(\d{4})/),mm=b1.match(/(\d{1,2})/);
if(ym)year=parseInt(ym[1]);if(mm)month=parseInt(mm[1]);
if(!mm){let sm=target.match(/CUST-(\d{1,2})/i);if(sm)month=parseInt(sm[1])}
scheduleYear=year;scheduleMonth=month;
let dim=new Date(year,month,0).getDate();
let headerRowIdx=-1;
for(let r=0;r<json.length;r++){let row=json[r];if(!row)continue;let a=getCell(row,0),b=getCell(row,1);if(a.includes('員工')||a.includes('日期')||b.includes('姓名')){headerRowIdx=r;break}}
if(headerRowIdx<0){showError('找不到表頭列');return}
let firstDateCol=-1;
let hr=json[headerRowIdx];
for(let c=0;c<hr.length;c++){if(getCell(hr,c)==='1'){firstDateCol=c;break}}
if(firstDateCol<0){for(let c=0;c<hr.length;c++){if(getCell(hr,c)==='日'){firstDateCol=c;break}}}
if(firstDateCol<0)firstDateCol=2;
let maxCol=firstDateCol+dim-1;

let personRows=[];
for(let r=0;r<json.length;r++){let row=json[r];if(!row)continue;let a=getCell(row,0),b=getCell(row,1);if(/^\d+$/.test(a)&&isValidName(b))personRows.push({r,empId:a,name:b})}

scheduleData=[];
for(let i=0;i<personRows.length;i++){
let{r,empId,name}=personRows[i];
let personRow=json[r];

// 模式 B：讀上一行作為班型行
let shiftRow=null;
if(r>0){
let prevRow=json[r-1];
if(prevRow){
let pa=getCell(prevRow,0),pb=getCell(prevRow,1);
if(!/^\d+$/.test(pa)&&pb===''){
let has=false;for(let c=firstDateCol;c<=maxCol;c++){if(getCell(prevRow,c)){has=true;break}}
if(has)shiftRow=prevRow;
}
}
}

let shifts={};
for(let c=firstDateCol;c<=maxCol;c++){
let dn=c-firstDateCol+1;if(dn<1||dn>dim)continue;
let mark=getCell(personRow,c);
let base=shiftRow?getCell(shiftRow,c):'';
let shiftCode='',note='';
if(mark==='代'){shiftCode=base||mark;note=base?'代':''}
else if(mark){shiftCode=mark}
else{shiftCode=base}
if(shiftCode)shifts[dn]={shift:shiftCode,originalShift:shiftCode,isHoliday:holidayShifts.includes(shiftCode),note:note}
}
if(Object.keys(shifts).length>0)scheduleData.push({name,empId,group:'顧客機維護組',category:'所有人',shifts,mainNote:''})
}

if(scheduleData.length===0){showError('無效班表資料，請確認格式');return}
refreshSpecialShifts();
updatePersonSelect();
hideLoading();document.getElementById('fileInfo').style.display='none';
let ps=document.getElementById('personSelect');if(ps.options.length>1){ps.selectedIndex=1;showPerson()}
}

function handleFile(file){
if(!file)return;showLoading();let rd=new FileReader();
rd.onload=e=>{try{let wb=XLSX.read(e.target.result,{type:'binary',cellStyles:true});parseWorkbook(wb,file.name)}catch(err){showError('解析失敗：'+err.message)}};
rd.readAsBinaryString(file)
}
